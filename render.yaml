services:
  - type: web
    name: blackgrid
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MAX_ROOMS
        value: 1
      - key: PERSIST_LEARNING
        value: 0
      - key: BLACKGRID_MAINTENANCE
        value: 1
      - key: AUTH_REQUIRED
        value: 1
      - key: NODE_VERSION
        value: 24.21.0

